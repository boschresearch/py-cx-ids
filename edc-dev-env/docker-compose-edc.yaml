version: "3.9"

services:
  control-plane:
    image: tractusx/edc-controlplane-postgresql-hashicorp-vault:${EDC_VERSION:-0.9.0}
    volumes:
      - ${OPENTELEMETRY_PROPERTIES_FILE:-./configs/default/opentelemetry.properties}:/app/opentelemetry.properties
      - ${LOGGING_CONFIGURATION_FILE:-./configs/default/logging.properties}:/app/logging.properties

  data-plane:
    image: tractusx/edc-dataplane-hashicorp-vault:${EDC_VERSION:-0.9.0}
    volumes:
      - ${OPENTELEMETRY_PROPERTIES_FILE:-./configs/default/opentelemetry.properties}:/app/opentelemetry.properties
      - ${LOGGING_CONFIGURATION_FILE:-./configs/default/logging.properties}:/app/logging.properties
